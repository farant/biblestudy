<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Medieval illuminated manuscript corner ornament -->
  <!-- Outer vine curves -->
  <path d="M5 60 Q5 5 60 5" stroke="#8B6914" stroke-width="2" fill="none"/>
  <path d="M10 60 Q10 10 60 10" stroke="#c4a95a" stroke-width="1" fill="none"/>

  <!-- Corner flourish -->
  <circle cx="12" cy="12" r="6" fill="#8B6914" opacity="0.3"/>
  <circle cx="12" cy="12" r="3" fill="#8B6914" opacity="0.6"/>

  <!-- Leaf cluster at corner -->
  <path d="M8 20 Q2 12 10 8 Q8 14 8 20 Z" fill="#8B6914" opacity="0.5"/>
  <path d="M20 8 Q12 2 8 10 Q14 8 20 8 Z" fill="#8B6914" opacity="0.5"/>

  <!-- Vine extending down -->
  <path d="M8 25 Q6 40 8 55" stroke="#8B6914" stroke-width="1.5" fill="none"/>
  <!-- Leaves on vertical vine -->
  <path d="M8 30 Q2 28 4 22 Q6 27 8 30 Z" fill="#8B6914" opacity="0.45"/>
  <path d="M8 30 Q14 28 12 22 Q10 27 8 30 Z" fill="#c4a95a" opacity="0.35"/>
  <path d="M8 42 Q2 40 3 34 Q5 39 8 42 Z" fill="#8B6914" opacity="0.4"/>
  <path d="M8 42 Q14 40 13 34 Q10 39 8 42 Z" fill="#c4a95a" opacity="0.3"/>

  <!-- Vine extending right -->
  <path d="M25 8 Q40 6 55 8" stroke="#8B6914" stroke-width="1.5" fill="none"/>
  <!-- Leaves on horizontal vine -->
  <path d="M30 8 Q28 2 22 4 Q27 6 30 8 Z" fill="#8B6914" opacity="0.45"/>
  <path d="M30 8 Q28 14 22 12 Q27 10 30 8 Z" fill="#c4a95a" opacity="0.35"/>
  <path d="M42 8 Q40 2 34 3 Q39 5 42 8 Z" fill="#8B6914" opacity="0.4"/>
  <path d="M42 8 Q40 14 34 13 Q39 10 42 8 Z" fill="#c4a95a" opacity="0.3"/>

  <!-- Small berry dots -->
  <circle cx="18" cy="18" r="1.5" fill="#8B6914" opacity="0.5"/>
  <circle cx="15" cy="22" r="1" fill="#c4a95a" opacity="0.4"/>
  <circle cx="22" cy="15" r="1" fill="#c4a95a" opacity="0.4"/>

  <!-- Inner decorative dot pattern along the curve -->
  <circle cx="20" cy="11" r="1" fill="#8B6914" opacity="0.3"/>
  <circle cx="28" cy="9" r="1" fill="#8B6914" opacity="0.3"/>
  <circle cx="36" cy="8" r="1" fill="#8B6914" opacity="0.3"/>
  <circle cx="11" cy="20" r="1" fill="#8B6914" opacity="0.3"/>
  <circle cx="9" cy="28" r="1" fill="#8B6914" opacity="0.3"/>
  <circle cx="8" cy="36" r="1" fill="#8B6914" opacity="0.3"/>
</svg>
